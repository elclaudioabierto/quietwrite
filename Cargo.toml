[package]
name = "quietwrite"
version = "0.8.0"
edition = "2021"
description = "A tiny distraction-free terminal writer for Raspberry Pi Zero"
license = "MIT"

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
zeroize = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events"] }
getrandom = "0.3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }

[target.'cfg(target_os = "linux")'.dependencies]
fontdue = { version = "0.9", default-features = false, features = ["std"] }
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
